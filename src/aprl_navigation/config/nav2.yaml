amcl:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: sim_world
    scan_topic: /front_right_lidar/scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    initial_pose: {x: -11.0, y: 5.0, z: 0.0, yaw: 0.0}
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_max_range: 20.0
    laser_min_range: 0.05
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.15
    z_hit: 0.8
    z_rand: 0.2
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 1.0
    tf_broadcast: true

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /ground_truth/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
    navigate_through_poses: {plugin: nav2_bt_navigator::NavigateThroughPosesNavigator}

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    odom_topic: /ground_truth/odom
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      lookahead_dist: 0.7
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.45
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 0.8
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.06
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      allow_reversing: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: sim_world
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.8

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.05
      footprint: '[[0.45, 0.34], [0.45, -0.34], [-0.45, -0.34], [-0.45, 0.34]]'
      footprint_padding: 0.03
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front:
          topic: /front_right_lidar/scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          inf_is_valid: true
          expected_update_rate: 0.5
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
        rear:
          topic: /rear_left_lidar/scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          inf_is_valid: true
          expected_update_rate: 0.5
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: sim_world
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.45, 0.34], [0.45, -0.34], [-0.45, -0.34], [-0.45, 0.34]]'
      footprint_padding: 0.03
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front:
          topic: /front_right_lidar/scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          inf_is_valid: true
          expected_update_rate: 0.5
          marking: true
          clearing: true
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
        rear:
          topic: /rear_left_lidar/scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          inf_is_valid: true
          expected_update_rate: 0.5
          marking: true
          clearing: true
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

aprl_command_mux:
  ros__parameters:
    command_timeout: 0.35
    permit_timeout: 0.4
    max_linear: 0.3
    max_angular: 0.6
